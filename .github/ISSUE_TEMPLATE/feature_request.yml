name: 功能建议
description: 想要一个新功能，或者觉得某处可以更好
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        这是个人向的本地优先工具，取舍会比较克制：优先做「记录 + 整理 + 阅读」范围内、不需要服务器的事。
        提之前可以先看看 [Roadmap](https://github.com/zxy-fish/Meme#roadmap) 里是不是已经在计划中。

  - type: textarea
    id: problem
    attributes:
      label: 你遇到了什么问题
      description: 描述使用场景，而不是直接给方案——这样更容易找到合适的做法
      placeholder: 例如：导入漫画时文件夹里混着封面图，会多出一页。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望怎么解决
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 现在是怎么绕过去的
      description: 现阶段的替代做法，能帮助判断优先级
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 涉及范围
      options:
        - 媒体库 / 分类 / 统计
        - 元数据搜索与填充
        - 阅读器（TXT / PDF / 漫画）
        - 备忘录 / 书签
        - 同步
        - 桌面端 / 应用内更新
        - 界面与交互
        - 其他
    validations:
      required: true
