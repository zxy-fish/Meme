appId: app.meme.library
productName: Meme
copyright: Copyright © 2026 zxy-fish
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - electron/**/*
  - package.json
asar: true
publish:
  provider: github
  owner: zxy-fish
  repo: Meme
mac:
  category: public.app-category.lifestyle
  icon: build/icon.icns
  identity: "-"
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Meme
linux:
  icon: build/icon.png
  target:
    - AppImage
